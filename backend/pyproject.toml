[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]
addopts = "-ra"


[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "**/migrations/*.py",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "DJ",
]


[tool.coverage.run]
branch = true
source = [
    "accounts",
    "config",
    "hooks",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]


[tool.coverage.report]
show_missing = true
skip_covered = true